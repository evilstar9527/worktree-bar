name: WorktreeBar
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  WorktreeBar:
    type: application
    platform: macOS
    sources:
      - path: WorktreeBar
        excludes:
          - "Info.plist"
    info:
      path: WorktreeBar/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Worktree Bar
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.worktreebar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Personal, unsigned tool — sandbox off so it can shell out to
        # /usr/bin/git and `open`. Ad-hoc sign for local runs.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
