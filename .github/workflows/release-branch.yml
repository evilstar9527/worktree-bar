name: Release Branch

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish WorktreeBar
    # macos-15 ships Xcode 16.x, required to read the project file format
    # (objectVersion 77) that XcodeGen emits. macos-14 (Xcode 15) cannot.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z, got: $VERSION"
            exit 1
          fi

          BUILD="$(git rev-list --count HEAD)"
          COMMIT="$(git rev-parse --short HEAD)"
          COMMIT_LONG="$(git rev-parse HEAD)"
          TAG="v${VERSION}"
          DMG_NAME="WorktreeBar-v${VERSION}.dmg"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "commit_long=$COMMIT_LONG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag already exists: ${TAG}"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${TAG}"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch version into project.yml
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_BUILD: ${{ steps.version.outputs.build }}
        run: |
          # Make VERSION the single source of truth: stamp it into project.yml
          # before generating, so the .app's CFBundleShortVersionString and
          # CFBundleVersion match the release tag.
          sed -i '' -E "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"${APP_VERSION}\"/" project.yml
          sed -i '' -E "s/CURRENT_PROJECT_VERSION: \"[^\"]*\"/CURRENT_PROJECT_VERSION: \"${APP_BUILD}\"/" project.yml
          echo "----- project.yml versions -----"
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build WorktreeBar.app
        run: |
          xcodebuild \
            -project WorktreeBar.xcodeproj \
            -scheme WorktreeBar \
            -configuration Release \
            SYMROOT="$PWD/build" \
            build
          APP="build/Release/WorktreeBar.app"
          if [[ ! -d "$APP" ]]; then
            echo "Could not find built app bundle at $APP"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Ad-hoc codesign app bundle
        run: |
          # The app is an unsigned personal tool (project.yml: CODE_SIGN_IDENTITY "-",
          # sandbox + hardened runtime off). Re-sign ad-hoc so Gatekeeper sees a
          # stable signature after packaging.
          /usr/bin/codesign --force --deep --sign - "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        env:
          DMG_NAME: ${{ steps.version.outputs.dmg_name }}
        run: |
          npm install --global create-dmg
          # create-dmg exits non-zero when it skips code-signing even on success,
          # so don't fail the step on its exit code — verify the file instead.
          # It names the output from CFBundleDisplayName ("Worktree Bar X.Y.dmg"),
          # so match with a "Worktree*.dmg" glob, not the bundle id.
          create-dmg --no-code-sign "$APP_PATH" ./ || true
          mv ./Worktree*.dmg "./${DMG_NAME}"
          test -f "./${DMG_NAME}"
          echo "----- DMG -----"
          ls -la "./${DMG_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WorktreeBar ${{ steps.version.outputs.tag }}
          body: |
            WorktreeBar ${{ steps.version.outputs.tag }}

            Built from `${{ steps.version.outputs.commit_long }}`.

            **Note:** this is an ad-hoc signed build. On first launch, right-click
            the app and choose **Open**, or run
            `xattr -dr com.apple.quarantine /Applications/WorktreeBar.app`.
          files: |
            ${{ steps.version.outputs.dmg_name }}
          prerelease: false
          make_latest: true
